<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>random fact tortoise
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-image: url('https://i.pinimg.com/736x/bd/3d/44/bd3d4481c760c9c8866840158e37e225.jpg'); background-size: cover; height: 100vh">
    <header class="hero">
      <h1 class="title">wise random fact tortoise</h1>
      <p class="tagline">press it for a random fact</p>
    </header>
    <main>
      <section class="fact-card">
        <div class="turtle" id="turtle">
          <img class="scene" src="Screenshot 2026-09-26 at 22.40.11.png" alt="random fact turtle" />
        </div>
        <button id="shake">press the turtle</button>
        <p class="message" id="message">press the button and the wise turtle will read you a fact from its book</p>
      </section>
    </main>
    <footer>
      <p class="made">made by Purli, thinking</p>
    </footer>
     <script src="script.js"></script>
  </body>
</html>
